version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - err113
    - errcheck
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - inamedparam
    - ineffassign
    - ireturn
    - lll
    - makezero
    - mnd
    - nilnil
    - nlreturn
    - noinlineerr
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    rules:
      # an example file prints its output, also from a method of a type
      # that its Example func runs
      - path: example_test\.go$
        linters:
          - forbidigo
