on: [push, pull_request]
name: Test
jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Test
        run: |
          # each module tests against the root in the same commit
          go work init . ./color ./glob ./toml ./yaml ./test
          for mod in . color glob toml yaml test; do
            (cd $mod && go test -v ./...)
          done
  test-tinygo:
    name: Test TinyGo
    runs-on: ubuntu-latest
    steps:
      - name: Install TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Test
        run: |
          tinygo test -v ./...
