on: [push, pull_request]
name: Test
jobs:
  test-go:
    name: Test Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the newest Go release and the two before it, see D24
        go-version: ["1.25", "1.26", stable]
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Test
        run: |
          # each module tests against the root in the same commit
          go work init . ./hcl ./toml ./yaml ./test
          for mod in . hcl toml yaml test; do
            (cd $mod && go test -v ./...)
          done
          # ./... skips a folder that starts with _, so name each tool
          go test -v ./_tools/cobraimport ./_tools/oximport/...
          # and each example
          go vet $(find _examples -name '*.go' -exec dirname {} \; | sort -u | sed 's|^|./|')
  test-tinygo:
    name: Test TinyGo
    runs-on: ubuntu-latest
    steps:
      - name: Install TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.44.0"
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Test
        run: |
          tinygo test -v ./...
